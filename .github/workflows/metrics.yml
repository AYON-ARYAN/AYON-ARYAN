name: Generate Metrics

on:
  schedule:
    - cron: "0 0 * * *" # runs daily
  workflow_dispatch: # allows manual trigger

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Overview metrics (stars, commits, PRs, issues + languages)
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          # Prefer a dedicated classic PAT (METRICS_TOKEN: scopes repo, read:org, read:user).
          # Falls back to the auto-provided GITHUB_TOKEN, which still reports public PRs/commits.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: AYON-ARYAN
          filename: github-metrics.svg
          template: classic
          base: "header, activity, community, repositories, metadata"
          config_timezone: Asia/Kolkata
          config_padding: 4%
          # count private contributions so PR/commit totals are accurate
          repositories_affiliations: owner, collaborator, organization_member
          # Most Used Languages
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sort: size
          plugin_languages_indepth: yes
          # Isometric commit calendar (replaces the broken streak card)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
